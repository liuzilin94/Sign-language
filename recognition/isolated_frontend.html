<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>孤立词手语识别</title>
    <style>
        :root {
            --bg: #f4efe6;
            --panel: rgba(255, 252, 247, 0.94);
            --panel-strong: #fffdf8;
            --line: rgba(94, 78, 61, 0.14);
            --text: #2d241d;
            --muted: #6d6156;
            --accent: #0f766e;
            --accent-strong: #0b5f59;
            --accent-soft: rgba(15, 118, 110, 0.12);
            --warn: #b45309;
            --error: #b42318;
            --ok: #18794e;
            --shadow: 0 20px 40px rgba(63, 42, 22, 0.12);
            --radius: 22px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top left, rgba(222, 184, 135, 0.26), transparent 32%),
                radial-gradient(circle at bottom right, rgba(15, 118, 110, 0.16), transparent 34%),
                linear-gradient(180deg, #f8f4ec 0%, #f0e8dc 100%);
        }

        .shell {
            width: min(1080px, calc(100% - 28px));
            margin: 28px auto;
        }

        .hero {
            position: relative;
            overflow: hidden;
            padding: 34px 30px;
            border-radius: 30px;
            background:
                linear-gradient(135deg, rgba(255, 248, 238, 0.98), rgba(247, 240, 230, 0.94));
            border: 1px solid rgba(87, 68, 52, 0.1);
            box-shadow: var(--shadow);
        }

        .hero::after {
            content: "";
            position: absolute;
            right: -40px;
            top: -42px;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: rgba(15, 118, 110, 0.08);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 9px 14px;
            border-radius: 999px;
            background: var(--accent-soft);
            color: var(--accent-strong);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        h1 {
            margin: 18px 0 10px;
            font-size: clamp(28px, 5vw, 48px);
            line-height: 1.08;
        }

        .hero p {
            max-width: 680px;
            margin: 0;
            color: var(--muted);
            font-size: 16px;
            line-height: 1.8;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            padding: 24px;
            border-radius: var(--radius);
            background: var(--panel);
            border: 1px solid var(--line);
            box-shadow: var(--shadow);
            backdrop-filter: blur(8px);
        }

        .card h2 {
            margin: 0 0 14px;
            font-size: 22px;
        }

        .hint {
            margin: 0 0 18px;
            color: var(--muted);
            line-height: 1.75;
            font-size: 14px;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 18px;
        }

        .tab {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 14px;
            background: #efe6d8;
            color: var(--text);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.18s ease;
        }

        .tab.active {
            background: var(--accent);
            color: #fff;
        }

        .tab:hover:not(.active) {
            background: #e5ddd0;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .status {
            padding: 14px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.7;
            background: #f6f2ea;
            border: 1px solid rgba(94, 78, 61, 0.14);
            color: var(--muted);
        }

        .status.ok {
            background: rgba(24, 121, 78, 0.08);
            border-color: rgba(24, 121, 78, 0.24);
            color: var(--ok);
        }

        .status.warn {
            background: rgba(180, 83, 9, 0.08);
            border-color: rgba(180, 83, 9, 0.24);
            color: var(--warn);
        }

        .status.error {
            background: rgba(180, 35, 24, 0.08);
            border-color: rgba(180, 35, 24, 0.24);
            color: var(--error);
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 18px;
        }

        button {
            appearance: none;
            border: none;
            cursor: pointer;
            transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
        }

        button:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 12px 22px rgba(20, 26, 34, 0.12);
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.55;
            transform: none;
            box-shadow: none;
        }

        .primary {
            padding: 13px 18px;
            border-radius: 14px;
            background: var(--accent);
            color: #fff;
            font-size: 14px;
            font-weight: 700;
        }

        .secondary {
            padding: 13px 18px;
            border-radius: 14px;
            background: #efe6d8;
            color: var(--text);
            font-size: 14px;
            font-weight: 700;
        }

        .danger {
            padding: 13px 18px;
            border-radius: 14px;
            background: var(--error);
            color: #fff;
            font-size: 14px;
            font-weight: 700;
        }

        .file-panel {
            margin-top: 20px;
            padding: 18px;
            border-radius: 18px;
            border: 1px dashed rgba(15, 118, 110, 0.36);
            background: rgba(15, 118, 110, 0.05);
        }

        .file-label {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 18px;
            border-radius: 14px;
            background: #ffffff;
            color: var(--accent-strong);
            font-weight: 700;
            cursor: pointer;
        }

        .file-label:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 22px rgba(20, 26, 34, 0.12);
        }

        input[type="file"] {
            display: none;
        }

        .file-meta {
            margin-top: 14px;
            padding: 14px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.88);
            border: 1px solid rgba(94, 78, 61, 0.08);
            color: var(--muted);
            font-size: 14px;
            line-height: 1.7;
        }

        /* 摄像头预览区域 */
        .webcam-container {
            position: relative;
            margin-top: 18px;
            border-radius: 18px;
            overflow: hidden;
            background: #000;
            aspect-ratio: 4/3;
        }

        #webcamVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        #webcamCanvas {
            display: none;
        }

        .webcam-overlay {
            position: absolute;
            top: 12px;
            left: 12px;
            padding: 8px 12px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            font-size: 13px;
            font-weight: 700;
        }

        .recording-indicator {
            display: none;
            position: absolute;
            top: 12px;
            right: 12px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #ff3b30;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .countdown {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 72px;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            display: none;
        }

        /* 结果显示区域 */
        .result-box {
            display: grid;
            gap: 14px;
        }

        .result-main {
            padding: 18px;
            border-radius: 20px;
            background:
                linear-gradient(135deg, rgba(15, 118, 110, 0.12), rgba(255, 255, 255, 0.94));
            border: 1px solid rgba(15, 118, 110, 0.18);
        }

        .result-label {
            color: var(--muted);
            font-size: 13px;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .result-text {
            margin-top: 10px;
            font-size: clamp(26px, 4vw, 40px);
            line-height: 1.18;
            font-weight: 800;
            word-break: break-word;
        }

        .metrics {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .metric {
            padding: 16px;
            border-radius: 16px;
            background: var(--panel-strong);
            border: 1px solid rgba(94, 78, 61, 0.08);
        }

        .metric-title {
            color: var(--muted);
            font-size: 13px;
        }

        .metric-value {
            margin-top: 8px;
            font-size: 21px;
            font-weight: 700;
        }

        /* 模型选择 */
        .model-select {
            margin-top: 18px;
        }

        .model-select label {
            display: block;
            margin-bottom: 8px;
            color: var(--muted);
            font-size: 14px;
        }

        .model-select select {
            width: 100%;
            padding: 12px;
            border-radius: 14px;
            border: 1px solid var(--line);
            background: #fff;
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
            cursor: pointer;
        }

        /* 日志 */
        details {
            margin-top: 8px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(94, 78, 61, 0.1);
            overflow: hidden;
        }

        summary {
            cursor: pointer;
            padding: 14px 16px;
            font-weight: 700;
        }

        pre {
            margin: 0;
            padding: 0 16px 16px;
            overflow: auto;
            color: #2f3b44;
            font-size: 13px;
            line-height: 1.65;
        }

        .log-list {
            display: grid;
            gap: 10px;
            max-height: 280px;
            overflow: auto;
        }

        .log-item {
            padding: 12px 14px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.84);
            border: 1px solid rgba(94, 78, 61, 0.08);
            color: var(--muted);
            font-size: 13px;
            line-height: 1.65;
        }

        .footer-tip {
            margin-top: 20px;
            padding: 16px 18px;
            border-radius: 16px;
            background: rgba(255, 251, 243, 0.92);
            border: 1px solid rgba(94, 78, 61, 0.1);
            color: var(--muted);
            font-size: 14px;
            line-height: 1.8;
        }

        @media (max-width: 880px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .hero {
                padding: 26px 20px;
            }

            .card {
                padding: 20px;
            }

            .metrics {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="shell">
        <section class="hero">
            <div class="badge">孤立词识别 / 支持40个手语词汇</div>
            <h1>孤立词手语识别</h1>
            <p>上传手语视频或使用摄像头录制，实时识别40个常用手语词汇。</p>
        </section>

        <section class="grid">
            <!-- 左侧：输入控制 -->
            <div class="card">
                <h2>识别输入</h2>
                
                <!-- 模型选择 -->
                <div class="model-select">
                    <label for="modelType">选择模型</label>
                    <select id="modelType">
                        <option value="cnn_lstm">CNN-LSTM（推荐）</option>
                        <option value="bilstm">BiLSTM</option>
                        <option value="gru">GRU</option>
                        <option value="transformer">Transformer</option>
                    </select>
                </div>

                <!-- 标签切换 -->
                <div class="tabs">
                    <button class="tab active" data-tab="video">视频上传</button>
                    <button class="tab" data-tab="webcam">摄像头录制</button>
                </div>

                <!-- 视频上传面板 -->
                <div id="videoPanel" class="tab-content active">
                    <p class="hint">支持 .mp4, .avi, .mov 等格式。录制时建议保持3秒左右。</p>
                    
                    <div class="file-panel">
                        <label class="file-label" for="videoInput">选择视频文件</label>
                        <input id="videoInput" type="file" accept="video/*">
                        <div id="fileMeta" class="file-meta">尚未选择视频文件。</div>
                    </div>
                </div>

                <!-- 摄像头面板 -->
                <div id="webcamPanel" class="tab-content">
                    <p class="hint">点击"开始录制"后，做出您想识别的手语动作（3秒自动停止）。</p>
                    
                    <div class="webcam-container">
                        <video id="webcamVideo" autoplay playsinline muted></video>
                        <div id="webcamOverlay" class="webcam-overlay">等待启动摄像头...</div>
                        <div id="recordingIndicator" class="recording-indicator"></div>
                        <div id="countdown" class="countdown"></div>
                    </div>
                    <canvas id="webcamCanvas" width="640" height="480"></canvas>
                </div>

                <!-- 操作按钮 -->
                <div class="actions">
                    <button id="initBtn" class="secondary" type="button">初始化模型</button>
                    <button id="predictBtn" class="primary" type="button">开始识别</button>
                </div>

                <div id="serviceStatus" class="status">等待初始化模型。</div>

                <div class="footer-tip">
                    <strong>使用说明：</strong>先点击"初始化模型"，然后选择视频上传或使用摄像头录制进行识别。
                </div>
            </div>

            <!-- 右侧：结果显示 -->
            <div class="card">
                <h2>识别结果</h2>
                <div class="result-box">
                    <div class="result-main">
                        <div class="result-label">识别词汇</div>
                        <div id="resultText" class="result-text">--</div>
                    </div>

                    <div class="metrics">
                        <div class="metric">
                            <div class="metric-title">置信度</div>
                            <div id="confidenceValue" class="metric-value">--</div>
                        </div>
                        <div class="metric">
                            <div class="metric-title">模型状态</div>
                            <div id="modelStatus" class="metric-value">未初始化</div>
                        </div>
                    </div>

                    <details>
                        <summary>查看原始返回 JSON</summary>
                        <pre id="rawJson">{}</pre>
                    </details>
                </div>
            </div>
        </section>

        <section class="card" style="margin-top: 20px;">
            <h2>运行日志</h2>
            <div id="logList" class="log-list"></div>
        </section>
    </div>

    <script>
        // API配置
        const API_BASE = "http://127.0.0.1:5001/api";
        
        // DOM元素
        const serviceStatus = document.getElementById("serviceStatus");
        const resultText = document.getElementById("resultText");
        const confidenceValue = document.getElementById("confidenceValue");
        const modelStatus = document.getElementById("modelStatus");
        const rawJson = document.getElementById("rawJson");
        const logList = document.getElementById("logList");
        const videoInput = document.getElementById("videoInput");
        const fileMeta = document.getElementById("fileMeta");
        const initBtn = document.getElementById("initBtn");
        const predictBtn = document.getElementById("predictBtn");
        const modelType = document.getElementById("modelType");
        const webcamVideo = document.getElementById("webcamVideo");
        const webcamCanvas = document.getElementById("webcamCanvas");
        const webcamOverlay = document.getElementById("webcamOverlay");
        const recordingIndicator = document.getElementById("recordingIndicator");
        const countdown = document.getElementById("countdown");

        // 状态变量
        let mediaStream = null;
        let isRecording = false;
        let mediaRecorder = null;
        let recordedChunks = [];

        // 日志函数
        function addLog(message) {
            const time = new Date().toLocaleTimeString("zh-CN", { hour12: false });
            const item = document.createElement("div");
            item.className = "log-item";
            item.textContent = `[${time}] ${message}`;
            logList.prepend(item);
        }

        // 状态显示
        function setStatus(text, type = "") {
            serviceStatus.className = `status${type ? " " + type : ""}`;
            serviceStatus.textContent = text;
        }

        // 格式化文件大小
        function formatSize(size) {
            if (!size && size !== 0) return "--";
            const units = ["B", "KB", "MB", "GB"];
            let value = size;
            let unitIndex = 0;
            while (value >= 1024 && unitIndex < units.length - 1) {
                value /= 1024;
                unitIndex += 1;
            }
            return `${value.toFixed(unitIndex === 0 ? 0 : 2)} ${units[unitIndex]}`;
        }

        // 格式化置信度
        function formatConfidence(value) {
            if (typeof value !== "number" || Number.isNaN(value)) return "--";
            return `${(value * 100).toFixed(2)}%`;
        }

        // 初始化孤立词预测器
        async function initIsolatedPredictor() {
            setStatus("正在连接模型服务并初始化预测器...", "warn");
            addLog("开始初始化孤立词预测器...");

            try {
                const response = await fetch(`${API_BASE}/init-isolated`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ 
                        model_type: modelType.value 
                    })
                });

                const data = await response.json();
                rawJson.textContent = JSON.stringify(data, null, 2);

                if (!response.ok || !data.success) {
                    modelStatus.textContent = "初始化失败";
                    setStatus(`模型初始化失败：${data.message || data.error || "未知错误"}`, "error");
                    addLog(`预测器初始化失败：${data.message || data.error || "未知错误"}`);
                    throw new Error(data.message || data.error || "预测器初始化失败");
                }

                modelStatus.textContent = `${data.model_type || modelType.value} (${data.num_classes || 40}类)`;
                setStatus(`模型初始化成功，已加载 ${data.num_classes || 40} 个词汇。`, "ok");
                addLog(`预测器初始化成功，模型类型：${data.model_type || modelType.value}`);
                return data;
            } catch (error) {
                modelStatus.textContent = "初始化失败";
                setStatus(`初始化失败：${error.message}`, "error");
                addLog(`初始化失败：${error.message}`);
                throw error;
            }
        }

        // 上传视频识别
        async function predictVideo(file) {
            const formData = new FormData();
            formData.append("video", file);

            const response = await fetch(`${API_BASE}/predict-isolated`, {
                method: "POST",
                body: formData
            });

            const data = await response.json();
            rawJson.textContent = JSON.stringify(data, null, 2);

            if (!response.ok || !data.success) {
                setStatus(`视频识别失败：${data.error || data.message || "未知错误"}`, "error");
                addLog(`视频识别失败：${data.error || data.message || "未知错误"}`);
                throw new Error(data.error || data.message || "视频识别失败");
            }

            resultText.textContent = data.result || "未识别到词汇";
            confidenceValue.textContent = formatConfidence(data.confidence);
            setStatus("识别完成！", "ok");
            addLog(`视频识别完成：${data.result || "未识别到词汇"}`);
            return data;
        }

        // 上传摄像头录制视频识别
        async function predictWebcamVideo(blob) {
            const formData = new FormData();
            formData.append("video", blob, "webcam_recording.mp4");

            const response = await fetch(`${API_BASE}/predict-isolated`, {
                method: "POST",
                body: formData
            });

            const data = await response.json();
            rawJson.textContent = JSON.stringify(data, null, 2);

            if (!response.ok || !data.success) {
                setStatus(`摄像头识别失败：${data.error || data.message || "未知错误"}`, "error");
                addLog(`摄像头识别失败：${data.error || data.message || "未知错误"}`);
                throw new Error(data.error || data.message || "摄像头识别失败");
            }

            resultText.textContent = data.result || "未识别到词汇";
            confidenceValue.textContent = formatConfidence(data.confidence);
            setStatus("识别完成！", "ok");
            addLog(`摄像头识别完成：${data.result || "未识别到词汇"}`);
            return data;
        }

        // 更新文件信息
        function updateFileMeta() {
            const file = videoInput.files[0];
            if (!file) {
                fileMeta.textContent = "尚未选择视频文件。";
                return;
            }

            fileMeta.innerHTML =
                `已选择文件：<strong>${file.name}</strong><br>` +
                `文件大小：${formatSize(file.size)}<br>` +
                `文件类型：${file.type || "未知类型"}`;
        }

        // 启动摄像头
        async function startWebcam() {
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: 640, height: 480 }, 
                    audio: false 
                });
                webcamVideo.srcObject = mediaStream;
                webcamOverlay.textContent = "摄像头已启动";
                addLog("摄像头启动成功");
                return true;
            } catch (error) {
                addLog(`摄像头启动失败：${error.message}`);
                setStatus(`摄像头启动失败：${error.message}`, "error");
                return false;
            }
        }

        // 停止摄像头
        function stopWebcam() {
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }
            webcamVideo.srcObject = null;
            webcamOverlay.textContent = "等待启动摄像头...";
        }

        // 录制摄像头视频
        async function recordWebcam(duration = 3) {
            return new Promise(async (resolve, reject) => {
                if (!mediaStream) {
                    const started = await startWebcam();
                    if (!started) {
                        reject(new Error("摄像头启动失败"));
                        return;
                    }
                    // 等待摄像头稳定
                    await new Promise(r => setTimeout(r, 1000));
                }

                isRecording = true;
                recordedChunks = [];

                // 显示录制界面
                recordingIndicator.style.display = "block";
                countdown.style.display = "block";
                countdown.textContent = duration;

                // 倒计时
                let count = duration;
                const countdownInterval = setInterval(() => {
                    count--;
                    if (count > 0) {
                        countdown.textContent = count;
                    }
                }, 1000);

                // 录制
                const options = { mimeType: 'video/webm;codecs=vp9' };
                if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                    options.mimeType = 'video/webm';
                }
                
                mediaRecorder = new MediaRecorder(mediaStream, options);
                
                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        recordedChunks.push(event.data);
                    }
                };

                mediaRecorder.onstop = () => {
                    clearInterval(countdownInterval);
                    isRecording = false;
                    recordingIndicator.style.display = "none";
                    countdown.style.display = "none";

                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    resolve(blob);
                };

                mediaRecorder.start();

                // 自动停止
                setTimeout(() => {
                    if (mediaRecorder.state === 'recording') {
                        mediaRecorder.stop();
                    }
                }, duration * 1000);
            });
        }

        // 执行识别流程
        async function runPredictionFlow() {
            initBtn.disabled = true;
            predictBtn.disabled = true;
            resultText.textContent = "识别中...";
            confidenceValue.textContent = "--";

            try {
                // 初始化模型（如果还没初始化）
                const initData = await initIsolatedPredictor();
                setStatus("预测器准备完成，正在识别...", "warn");

                // 根据当前标签页选择识别方式
                const activeTab = document.querySelector(".tab.active").dataset.tab;

                if (activeTab === "video") {
                    // 视频上传识别
                    const file = videoInput.files[0];
                    if (!file) {
                        setStatus("请先选择一个视频文件。", "warn");
                        addLog("用户尝试识别，但尚未选择文件。");
                        return;
                    }
                    addLog(`开始上传视频：${file.name}`);
                    await predictVideo(file);
                } else {
                    // 摄像头录制识别
                    addLog("开始录制摄像头视频...");
                    const blob = await recordWebcam(3);
                    addLog("录制完成，正在上传识别...");
                    await predictWebcamVideo(blob);
                }
            } catch (error) {
                if (!resultText.textContent || resultText.textContent === "识别中...") {
                    resultText.textContent = "识别失败";
                }
                addLog(`识别失败：${error.message}`);
            } finally {
                initBtn.disabled = false;
                predictBtn.disabled = false;
            }
        }

        // 标签页切换
        document.querySelectorAll(".tab").forEach(tab => {
            tab.addEventListener("click", () => {
                document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
                document.querySelectorAll(".tab-content").forEach(p => p.classList.remove("active"));
                
                tab.classList.add("active");
                const panelId = tab.dataset.tab + "Panel";
                document.getElementById(panelId).classList.add("active");
            });
        });

        // 事件监听
        videoInput.addEventListener("change", updateFileMeta);

        initBtn.addEventListener("click", async () => {
            initBtn.disabled = true;
            try {
                await initIsolatedPredictor();
            } catch (error) {
            } finally {
                initBtn.disabled = false;
            }
        });

        predictBtn.addEventListener("click", runPredictionFlow);

        addLog("页面已加载，请先初始化模型。");
    </script>
</body>
</html>
